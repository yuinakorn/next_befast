services:
  next-befast:
    image: ghcr.io/yuinakorn/next_befast:${TAG:-latest}
    container_name: next-befast
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-admin}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}

  # Visitor analytics. The site proxies the tracker under /stats; the
  # dashboard is served by Nginx Proxy Manager (umami.chiangmaihealth.go.th
  # -> next-befast-umami:3000) over the shared proxy network.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: next-befast-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      CLIENT_IP_HEADER: cf-connecting-ip
      DISABLE_TELEMETRY: 1
    networks: [default, proxy]
    depends_on:
      umami-db:
        condition: service_healthy
    init: true

  umami-db:
    image: postgres:16-alpine
    container_name: next-befast-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:

networks:
  proxy:
    external: true
    name: nginx_proxy_manager_default
